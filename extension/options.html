<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS Translatorの設定</title>
<h1>SNS Translatorの設定</h1>
<label>翻訳先の言語 <select id="target-language" disabled></select></label>
<p id="language-status" role="status"></p>
<details>
  <summary>翻訳する原文の言語</summary>
  <fieldset id="source-languages" disabled>
    <legend>翻訳対象</legend>
    <label><input id="all-source-languages" type="checkbox" checked> すべての言語を対象にする</label>
    <div>
      <p>翻訳する言語を選択してください。複数選べます。</p>
      <div id="source-language-choices" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 4px;"></div>
    </div>
  </fieldset>
  <p id="source-language-status" role="status"></p>
</details>
<label>翻訳の実行先
  <select id="inference-mode" disabled>
    <option value="auto">自動（GPU優先）</option>
    <option value="gpu">GPU（WebGPU）</option>
    <option value="cpu">CPU</option>
  </select>
</label>
<p id="inference-status" role="status"></p>
<label><input id="auto-translate" type="checkbox" disabled> 投稿とコミュニティノートを読み込み順に自動翻訳する</label>
<p id="auto-translate-status" role="status"></p>
<p>Xの投稿を翻訳するには、PLaMo 3 Translateの0.8Bモデルを読み込んでください。</p>
<p><a href="https://huggingface.co/pfnet/plamo-3-translate-0.8b-GGUF/resolve/main/plamo-3-translate-0.8b-Q4_K_M.gguf">モデルをダウンロード（約573MB）</a></p>
<label>ダウンロードしたGGUFファイル <input type="file" accept=".gguf" disabled></label>
<p role="status" id="status">モデルを確認中…</p>
<form id="cache-settings">
  <fieldset disabled>
    <legend>翻訳キャッシュ</legend>
    <p>使用量 <meter id="cache-meter" aria-label="翻訳キャッシュの使用量" min="0" max="1" value="0"></meter>
      <span id="cache-usage" role="status">確認中…</span>
    </p>
    <label>上限（MiB） <input id="cache-limit" type="number" min="1" step="1" required></label>
    <button type="submit">上限を保存</button>
    <button id="clear-cache" type="button">キャッシュを削除</button>
  </fieldset>
  <p id="cache-status" role="status"></p>
</form>
<script src="languages.js"></script>
<script type="module" src="options.js"></script>
</html>
